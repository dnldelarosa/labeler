url: https://adatar-do.github.io/labeler/


template:
  bootstrap: 5
  bootswatch: flatly


authors:
  Daniel E. de la Rosa:
    href: http://dnldelarosa.com
  Adatar:
    html: <div><img src="https://raw.githubusercontent.com/adatar-do/adatar-do.github.io/main/logotipo.png" alt="Adatar" height="20"> <span style="font-weight:900; margin:10px;">Adatar</span></div>
    href: http://adatar.do
  sidebar:
    roles: [aut, cph]

reference:
- title: Dictionary creation and conversion
  desc: Functions to create, convert, and inspect dictionaries.
  contents:
  - Dict
  - gen_Dict
  - is.Dict
  - as.Dict
  - print.Dict
  - as.data.frame.Dict
  - dict_browser

- title: Applying and using Dictionaries
  desc: Functions to apply dictionaries to data and utilize label information.
  contents:
  - set_Dict
  - with_Dict

- title: JSON Serialization
  desc: Export and import dictionaries as JSON for R/Python interoperability.
  contents:
  - to_json
  - from_json

- title: Database Storage
  desc: Store and retrieve dictionaries from any SQL database via DBI.
  contents:
  - db_save_dict
  - db_load_dict
  - db_list_dicts
  - db_delete_dict

- title: Testing resources
  desc: Data and Dictionary objects used for testing purposes.
  contents:
  - lbl_df
  - lbl_df_dict

- title: Deprecated functions
  desc: Legacy functions from the old API. Use the Dict-based functions instead.
  contents:
  - set_labels
  - use_labels
  - get_dict
  - browse_dict
